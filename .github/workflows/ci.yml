name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]" \
            "sqlalchemy>=2.0" "alembic>=1.13" "argon2-cffi>=23.1" "itsdangerous>=2.1" "httpx>=0.27"
      - name: Compile check
        run: python -m compileall -q server map_api.py dcf_export.py store.py comps.py reverse_dcf.py
      - name: Migration validation (empty DB up + down)
        env:
          OASIS_DATABASE_URL: sqlite:///./data/ci.db
        run: |
          mkdir -p data
          python -m alembic upgrade head
          python -m alembic downgrade base
      - name: Tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip && pip install -e ".[dev]"
          npm ci || npm install
          npx playwright install --with-deps chromium firefox webkit
      - name: JS syntax
        run: for f in graph/js/*.js; do node --check "$f"; done
      - name: Vendored MapLibre present (no CDN)
        run: |
          test -f graph/vendor/maplibre-gl/5.6.2/maplibre-gl.js
          ! grep -q "unpkg.com" graph/index.html graph/js/main.js
      - name: Playwright
        run: npx playwright test

  security:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependency audit
        run: |
          python -m pip install -U pip pip-audit
          pip install -e ".[dev]"
          pip-audit || true   # advisory until a triage policy is set
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t oasis:ci .
      - name: Migrate against ephemeral Postgres
        run: |
          docker network create oasisnet
          docker run -d --name pg --network oasisnet \
            -e POSTGRES_USER=oasis -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=oasis postgres:16-alpine
          sleep 8
          docker run --rm --network oasisnet \
            -e OASIS_MODE=staging \
            -e OASIS_DATABASE_URL='postgresql+psycopg://oasis:ci@pg/oasis' \
            -e OASIS_SESSION_SECRET='ci-secret-at-least-thirty-two-chars-xx' \
            -e OASIS_ALLOWED_ORIGINS='https://ci.example.com' \
            -e OASIS_TRUSTED_HOSTS='ci.example.com' \
            -e OASIS_PUBLIC_BASE_URL='https://ci.example.com' \
            -e OASIS_COOKIE_SECURE=true -e OASIS_EMAIL_BACKEND=smtp \
            oasis:ci python -m alembic upgrade head
      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          image: oasis:ci
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Image scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: oasis:ci
          format: table
          exit-code: "0"   # advisory until a triage policy is set
