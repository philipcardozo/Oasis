name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "deploy target"
        type: choice
        options: [staging]
        default: staging

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: oasis-${{ github.event_name == 'workflow_dispatch' && inputs.target || 'staging' }}-deploy
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/oasis

jobs:
  staging:
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]" \
            "sqlalchemy>=2.0" "alembic>=1.13" "argon2-cffi>=23.1" "itsdangerous>=2.1" "httpx>=0.27"
          npm ci || npm install
          npx playwright install --with-deps chromium firefox webkit

      - name: Validate migrations
        env:
          OASIS_DATABASE_URL: sqlite:///./data/deploy-ci.db
        run: |
          mkdir -p data
          python -m alembic upgrade head
          python -m server.migration_check --expected 29995ef61d8e
          python -m alembic downgrade base

      - name: Python tests
        run: python -m pytest -q

      - name: Playwright tests
        run: npx playwright test

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=staging-${{ github.sha }}

      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Scan published image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

      - name: Record image manifest
        run: |
          python scripts/public_staging_image_manifest.py \
            --commit="${GITHUB_SHA}" \
            --image="${IMAGE_NAME}@${{ steps.build.outputs.digest }}" \
            --digest="${{ steps.build.outputs.digest }}" \
            --architecture="linux/amd64" \
            --registry="ghcr.io" \
            --tag="staging-${GITHUB_SHA}" \
            --migration-check=pass \
            --python-tests=pass \
            --playwright-tests=pass \
            --image-scan=pass \
            --sbom=present \
            --provenance=present

      - name: Deploy exact image to Render API and worker
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_SERVICE_ID: ${{ secrets.RENDER_API_SERVICE_ID }}
          RENDER_WORKER_SERVICE_ID: ${{ secrets.RENDER_WORKER_SERVICE_ID }}
        run: |
          python scripts/render_deploy_image.py \
            --image-url="${IMAGE_NAME}@${{ steps.build.outputs.digest }}" \
            --image-manifest=docs/evidence/public-staging/01-image-manifest.json

      - name: Public staging preflight
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
          OASIS_CF_ACCESS_CLIENT_ID: ${{ secrets.OASIS_CF_ACCESS_CLIENT_ID }}
          OASIS_CF_ACCESS_CLIENT_SECRET: ${{ secrets.OASIS_CF_ACCESS_CLIENT_SECRET }}
        run: |
          python scripts/public_staging_preflight.py \
            --base-url="$STAGING_URL" \
            --expect-commit="$GITHUB_SHA" \
            --header CF-Access-Client-Id=OASIS_CF_ACCESS_CLIENT_ID \
            --header CF-Access-Client-Secret=OASIS_CF_ACCESS_CLIENT_SECRET

      - name: Upload public staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-staging-evidence-${{ github.sha }}
          path: docs/evidence/public-staging/
          if-no-files-found: ignore
