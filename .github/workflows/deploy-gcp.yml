name: Deploy GCP

on:
  workflow_dispatch:
    inputs:
      target:
        description: "deploy target"
        type: choice
        options: [staging]
        default: staging

permissions:
  contents: read
  id-token: write

concurrency:
  group: oasis-gcp-staging-deploy
  cancel-in-progress: false

env:
  OASIS_DEPLOY_PROVIDER: gcp
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
  GCP_CLOUD_RUN_SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
  GCP_CLOUD_RUN_WORKER_POOL: ${{ vars.GCP_CLOUD_RUN_WORKER_POOL }}
  GCP_CLOUD_SQL_INSTANCE: ${{ vars.GCP_CLOUD_SQL_INSTANCE }}
  GCP_STORAGE_BUCKET: ${{ vars.GCP_STORAGE_BUCKET }}
  STAGING_URL: ${{ vars.STAGING_URL }}
  IMAGE_NAME: oasis
  MIGRATE_JOB: oasis-staging-migrate

jobs:
  staging:
    runs-on: ubuntu-22.04
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deploy gate dependencies
        run: |
          python -m pip install -U pip PyYAML

      - name: Validate public staging config contract
        run: |
          python3 scripts/public_staging_config_contract.py --provider=gcp

      - name: Public staging readiness
        run: |
          python3 scripts/public_staging_readiness.py --mode=github-actions

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]" \
            "sqlalchemy>=2.0" "alembic>=1.13" "argon2-cffi>=23.1" "itsdangerous>=2.1" "httpx>=0.27"
          npm ci || npm install
          npx playwright install --with-deps chromium firefox webkit

      - name: Validate migrations
        env:
          OASIS_DATABASE_URL: sqlite:///./data/deploy-ci.db
        run: |
          mkdir -p data
          python -m alembic upgrade head
          python -m server.migration_check --expected 29995ef61d8e
          python -m alembic downgrade base

      - name: Python tests
        run: python -m pytest -q

      - name: Playwright tests
        run: npx playwright test

      - name: Build image with Cloud Build
        run: |
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"
          gcloud config set run/region "${GCP_REGION}"
          gcloud builds submit --tag "${IMAGE}" .
          DIGEST="$(gcloud artifacts docker images describe "${IMAGE}" --format='value(image_summary.digest)')"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          echo "IMAGE_DIGEST=${DIGEST}" >> "$GITHUB_ENV"
          echo "IMAGE_URL=${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REPOSITORY}/${IMAGE_NAME}@${DIGEST}" >> "$GITHUB_ENV"

      - name: Deploy migration job
        run: |
          gcloud run jobs deploy "${MIGRATE_JOB}" \
            --image="${IMAGE_URL}" \
            --region="${GCP_REGION}" \
            --service-account="oasis-migrate@${GCP_PROJECT_ID}.iam.gserviceaccount.com" \
            --set-cloudsql-instances="${GCP_PROJECT_ID}:${GCP_REGION}:${GCP_CLOUD_SQL_INSTANCE}" \
            --set-secrets="OASIS_DATABASE_URL=oasis-database-url:latest,DATABASE_URL=oasis-database-url:latest,OASIS_SESSION_SECRET=oasis-session-secret:latest,OASIS_SMTP_PASSWORD=oasis-smtp-password:latest" \
            --set-env-vars="OASIS_MODE=staging,OASIS_ENV=staging,OASIS_DEPLOY_PROVIDER=gcp,OASIS_EMAIL_BACKEND=smtp,OASIS_SMTP_PORT=587,OASIS_SMTP_STARTTLS=true,OASIS_STORAGE_BACKEND=local,OASIS_STORAGE_DIR=/app/outputs/storage" \
            --command=python \
            --args=-m,alembic,upgrade,head \
            --max-retries=0 \
            --task-timeout=10m

      - name: Execute migration
        run: |
          gcloud run jobs execute "${MIGRATE_JOB}" --region="${GCP_REGION}" --wait

      - name: Deploy API revision
        run: |
          gcloud run deploy "${GCP_CLOUD_RUN_SERVICE}" \
            --image="${IMAGE_URL}" \
            --region="${GCP_REGION}" \
            --service-account="oasis-api@${GCP_PROJECT_ID}.iam.gserviceaccount.com" \
            --execution-environment=gen2 \
            --allow-unauthenticated \
            --no-traffic \
            --tag=candidate \
            --add-cloudsql-instances="${GCP_PROJECT_ID}:${GCP_REGION}:${GCP_CLOUD_SQL_INSTANCE}" \
            --add-volume=name=oasis-exports,type=cloud-storage,bucket=${GCP_STORAGE_BUCKET},mount-path=/app/outputs \
            --set-secrets="OASIS_DATABASE_URL=oasis-database-url:latest,DATABASE_URL=oasis-database-url:latest,OASIS_SESSION_SECRET=oasis-session-secret:latest,OASIS_SMTP_PASSWORD=oasis-smtp-password:latest" \
            --set-env-vars="OASIS_MODE=staging,OASIS_ENV=staging,OASIS_DEPLOY_PROVIDER=gcp,OASIS_ALLOWED_ORIGINS=${STAGING_URL},OASIS_TRUSTED_HOSTS=*.a.run.app,OASIS_PUBLIC_BASE_URL=${STAGING_URL},OASIS_API_BASE_URL=${STAGING_URL},OASIS_BUILD_COMMIT=${GITHUB_SHA},OASIS_EMAIL_BACKEND=smtp,OASIS_SMTP_PORT=587,OASIS_SMTP_STARTTLS=true,OASIS_STORAGE_BACKEND=local,OASIS_STORAGE_DIR=/app/outputs/storage,OASIS_LOG_JSON=true,OASIS_FEATURE_SATELLITE=false,OASIS_FEATURE_PRICES=false,OASIS_FEATURE_LOGOS=false" \
            --port=8080 \
            --cpu=1 \
            --memory=1Gi \
            --concurrency=40 \
            --min=0 \
            --max=3 \
            --timeout=300
          CANDIDATE_URL="$(gcloud run services describe "${GCP_CLOUD_RUN_SERVICE}" --region="${GCP_REGION}" --format=json | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(item["url"] for item in data.get("status", {}).get("traffic", []) if item.get("tag") == "candidate"))')"
          echo "CANDIDATE_URL=${CANDIDATE_URL}" >> "$GITHUB_ENV"

      - name: Public preflight
        run: |
          python scripts/public_staging_preflight.py \
            --base-url="${CANDIDATE_URL}" \
            --expect-commit="${GITHUB_SHA}"

      - name: Public Playwright tests
        env:
          OASIS_PUBLIC_PLAYWRIGHT_BASE_URL: ${{ env.CANDIDATE_URL }}
        run: |
          npx playwright test --config=playwright.public.config.js

      - name: Deploy worker pool
        run: |
          gcloud run worker-pools deploy "${GCP_CLOUD_RUN_WORKER_POOL}" \
            --image="${IMAGE_URL}" \
            --region="${GCP_REGION}" \
            --service-account="oasis-worker@${GCP_PROJECT_ID}.iam.gserviceaccount.com" \
            --instances=1 \
            --add-cloudsql-instances="${GCP_PROJECT_ID}:${GCP_REGION}:${GCP_CLOUD_SQL_INSTANCE}" \
            --add-volume=name=oasis-exports,type=cloud-storage,bucket=${GCP_STORAGE_BUCKET},mount-path=/app/outputs \
            --set-secrets="OASIS_DATABASE_URL=oasis-database-url:latest,DATABASE_URL=oasis-database-url:latest,OASIS_SESSION_SECRET=oasis-session-secret:latest,OASIS_SMTP_PASSWORD=oasis-smtp-password:latest" \
            --set-env-vars="OASIS_MODE=staging,OASIS_ENV=staging,OASIS_DEPLOY_PROVIDER=gcp,OASIS_PUBLIC_BASE_URL=${STAGING_URL},OASIS_API_BASE_URL=${STAGING_URL},OASIS_BUILD_COMMIT=${GITHUB_SHA},OASIS_EMAIL_BACKEND=smtp,OASIS_SMTP_PORT=587,OASIS_SMTP_STARTTLS=true,OASIS_STORAGE_BACKEND=local,OASIS_STORAGE_DIR=/app/outputs/storage,OASIS_LOG_JSON=true" \
            --command=python \
            --args=-m,server.worker \
            --cpu=1 \
            --memory=512Mi

      - name: Shift API traffic after gates pass
        run: |
          gcloud run services update-traffic "${GCP_CLOUD_RUN_SERVICE}" \
            --region="${GCP_REGION}" \
            --to-tags=candidate=100

      - name: Upload public staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcp-public-staging-evidence-${{ github.sha }}
          path: docs/evidence/public-staging/
          if-no-files-found: ignore
