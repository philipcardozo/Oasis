# Render Blueprint for OASIS public staging.
#
# Replace placeholder host/origin values in the Render dashboard or Blueprint
# sync before first deploy. Do not commit real domains if they reveal private
# access tokens or account identifiers.
services:
  - type: web
    name: oasis-api-staging
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    autoDeployTrigger: off
    numInstances: 1
    healthCheckPath: /healthz
    preDeployCommand: python -m alembic upgrade head
    envVars:
      - fromGroup: oasis-staging-shared
      - key: OASIS_DATABASE_URL
        fromDatabase:
          name: oasis-postgres-staging
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: oasis-postgres-staging
          property: connectionString

  - type: worker
    name: oasis-worker-staging
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    autoDeployTrigger: off
    dockerCommand: python -m server.worker
    envVars:
      - fromGroup: oasis-staging-shared
      - key: OASIS_DATABASE_URL
        fromDatabase:
          name: oasis-postgres-staging
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: oasis-postgres-staging
          property: connectionString

databases:
  - name: oasis-postgres-staging
    databaseName: oasis_staging
    user: oasis_staging
    plan: starter
    region: oregon
    ipAllowList: []

envVarGroups:
  - name: oasis-staging-shared
    envVars:
      - key: OASIS_MODE
        value: staging
      - key: OASIS_ENV
        value: staging
      - key: OASIS_SESSION_SECRET
        generateValue: true
      - key: OASIS_PUBLIC_BASE_URL
        sync: false
      - key: OASIS_API_BASE_URL
        sync: false
      - key: OASIS_ALLOWED_ORIGINS
        sync: false
      - key: OASIS_TRUSTED_HOSTS
        sync: false
      - key: OASIS_COOKIE_SECURE
        value: "true"
      - key: OASIS_COOKIE_SAMESITE
        value: lax
      - key: OASIS_TRUST_PROXY
        value: "true"
      - key: OASIS_HSTS_MAX_AGE
        value: "31536000"
      - key: OASIS_HSTS_INCLUDE_SUBDOMAINS
        value: "false"
      - key: OASIS_HSTS_PRELOAD
        value: "false"
      - key: OASIS_EMAIL_BACKEND
        value: smtp
      - key: OASIS_EMAIL_FROM
        sync: false
      - key: OASIS_SMTP_HOST
        sync: false
      - key: OASIS_SMTP_PORT
        value: "587"
      - key: OASIS_SMTP_STARTTLS
        value: "true"
      - key: OASIS_SMTP_USER
        sync: false
      - key: OASIS_SMTP_PASSWORD
        sync: false
      - key: OASIS_STORAGE_BACKEND
        value: s3
      - key: OASIS_S3_BUCKET
        sync: false
      - key: OASIS_S3_REGION
        value: auto
      - key: OASIS_S3_ENDPOINT
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: OASIS_LOG_JSON
        value: "true"
      - key: OASIS_OTEL_ENABLED
        value: "true"
      - key: OASIS_FEATURE_SATELLITE
        value: "false"
      - key: OASIS_FEATURE_PRICES
        value: "false"
      - key: OASIS_FEATURE_LOGOS
        value: "false"
